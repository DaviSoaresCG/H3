<style>
        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen">
<!-- TopAppBar (Small) -->
<header class="bg-surface border-b border-border-subtle flex justify-between items-center w-full px-4 h-16 fixed top-0 w-full z-50">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A detailed headshot portrait of a field worker in uniform, shot in bright daylight with a clear blue sky background, conveying a sense of readiness and professionalism. The lighting is natural and flattering, emphasizing a modern operational aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCABFxCMJlRQHhcD5CJkFVCX1t_0lX-ytX1OsOhzraxzA9jvfxwTAk1DSzzvrKcd-bky6pFiBmyFwP9c5u6yqiYO1sN8KTviWMeDURGDAYgQyMU8miccKvk6N4Hwzd8hwmGeHkDY45Xne6Lt2-b-BsbQYeCAk2cksm5FeIrBZsW1a9QyjQL7fU-1i_eeuNFeLV3x3Tbv0yKDPkdi6xCMUKTU684io_dPqauvBtHANHO3ydcldN7Agnm">
</div>
<span class="text-headline-md font-headline-md font-bold text-primary">EventPoint</span>
</div>
<div class="text-primary hover:bg-surface-container transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">signal_cellular_alt</span>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-[80px] pb-[96px] px-margin-mobile flex flex-col items-center min-h-screen">
<!-- Status Header (Date & GPS) -->
<div class="w-full flex justify-between items-center mb-8">
<div class="flex flex-col">
<span class="text-body-sm font-body-sm text-on-surface-variant" id="current-date">Sexta-feira, 24 de Nov</span>
<span class="text-body-md font-body-md font-bold text-primary">Turno Manhã</span>
</div>
<div class="flex items-center gap-1 bg-surface-card border border-border-subtle px-3 py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-[16px] text-success-vibrant" style="font-variation-settings: 'FILL' 1;">satellite_alt</span>
<span class="text-label-bold font-label-bold text-success-vibrant">GPS ATIVO</span>
</div>
</div>
<!-- Clock & Main Action -->
<div class="flex flex-col items-center justify-center w-full flex-grow max-w-sm mx-auto">
<!-- Digital Clock -->
<div class="mb-10 text-center">
<div class="text-headline-lg font-headline-lg text-primary tracking-tight font-black" id="digital-clock" style="font-size: 3.5rem; line-height: 1;">
                    --:--
                </div>
<div class="text-body-md font-body-md text-on-surface-variant mt-2" id="clock-seconds">
                    --
                </div>
</div>
<!-- Main Punch Button -->
<button class="relative w-48 h-48 rounded-full bg-success-vibrant text-on-secondary shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.1),0px_2px_4px_-2px_rgba(15,23,42,0.1)] active:scale-95 active:translate-y-[1px] active:shadow-none transition-all duration-150 flex flex-col items-center justify-center border-4 border-surface-card" id="btn-punch">
<span class="material-symbols-outlined text-[48px] mb-2">touch_app</span>
<span class="text-headline-md font-headline-md font-bold text-on-secondary">BATER PONTO</span>
</button>
</div>
<!-- Quick History -->
<div class="w-full max-w-sm mt-12 bg-surface-card border border-border-subtle rounded-xl p-4 flex items-center gap-4 border-l-4 border-l-success-vibrant shadow-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-success-vibrant">
<span class="material-symbols-outlined">login</span>
</div>
<div class="flex flex-col flex-grow">
<span class="text-body-sm font-body-sm text-on-surface-variant">Última batida</span>
<span class="text-body-md font-body-md font-bold text-primary">08:00 (Entrada)</span>
</div>
<span class="text-body-sm font-body-sm text-outline">Hoje</span>
</div>
<!-- Conditional Audio Report Action (Simulating state where it's available) -->
<button class="w-full max-w-sm mt-4 bg-surface-card border border-border-subtle rounded-xl p-4 flex items-center gap-4 shadow-sm active:scale-98 transition-transform">
<div class="relative w-10 h-10 flex items-center justify-center">
<div class="absolute inset-0 rounded-full bg-alert-warning opacity-20 pulse-animation"></div>
<div class="relative w-10 h-10 rounded-full bg-alert-warning flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined">mic</span>
</div>
</div>
<div class="flex flex-col text-left">
<span class="text-body-md font-body-md font-bold text-primary">Registrar Relato</span>
<span class="text-body-sm font-body-sm text-on-surface-variant">Necessário para encerramento</span>
</div>
<span class="material-symbols-outlined text-outline ml-auto">chevron_right</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface border-t border-border-subtle shadow-lg rounded-t-xl">
<!-- Active Tab: Ponto -->
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="text-label-bold font-label-bold mt-1">Ponto</span>
</div>
<!-- Inactive Tab: Frota -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined">directions_car</span>
<span class="text-label-bold font-label-bold mt-1">Frota</span>
</div>
<!-- Inactive Tab: Viagens -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined">route</span>
<span class="text-label-bold font-label-bold mt-1">Viagens</span>
</div>
<!-- Inactive Tab: Perfil -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined">person</span>
<span class="text-label-bold font-label-bold mt-1">Perfil</span>
</div>
</nav>
<!-- Interaction Script -->
<script>
        function updateClock() {
            const now = new Date();
            
            // Format time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('digital-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('clock-seconds').textContent = `${seconds}s`;

            // Format date loosely for demo (static in HTML for reliable visual structure, but could be dynamic here)
        }

        setInterval(updateClock, 1000);
        updateClock(); // Initial call
        
        // Simple punch interaction feedback
        document.getElementById('btn-punch').addEventListener('click', function() {
            // Visual feedback handled by active: classes in Tailwind
            console.log('Punch recorded via UI simulation');
        });
    </script>
</body></html>
