<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-card rounded-xl border border-border-subtle p-8 shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.1),0px_2px_4px_-2px_rgba(15,23,42,0.1)]">
<!-- Header / Logo -->
<header class="flex flex-col items-center mb-8">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-4 text-on-primary">
<span class="material-symbols-outlined text-3xl" data-weight="fill">event</span>
</div>
<h1 class="text-headline-md font-headline-md font-bold text-navy-deep">EventPoint</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-2 text-center">Acesse sua conta para continuar</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-5" id="loginForm">
<!-- CPF Input -->
<div class="flex flex-col gap-1">
<label class="text-body-sm font-body-sm text-navy-deep font-semibold" for="cpf">CPF</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">badge</span>
<input class="w-full h-12 pl-10 pr-3 rounded border border-border-subtle bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="cpf" maxlength="14" name="cpf" placeholder="000.000.000-00" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="text-body-sm font-body-sm text-navy-deep font-semibold" for="password">Senha</label>
<a class="text-label-bold font-label-bold text-secondary hover:underline" href="#">Esqueci minha senha</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full h-12 pl-10 pr-10 rounded border border-border-subtle bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-4 bg-primary text-on-primary text-body-md font-body-md font-semibold rounded shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.1)] hover:bg-opacity-90 active:scale-98 active:shadow-none active:translate-y-px transition-all flex items-center justify-center gap-2" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-sm">login</span>
</button>
</form>
</main>
<script>
        // CPF Mask Logic
        const cpfInput = document.getElementById('cpf');
        cpfInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 9) {
                value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/^(\d{3})(\d{0,3}).*/, '$1.$2');
            }
            e.target.value = value;
        });

        // Password Visibility Toggle
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');

        togglePasswordBtn.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form Submit Simulation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Entrando...</span>';
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                // Simulate redirect or next action here
            }, 1500);
        });
    </script>
