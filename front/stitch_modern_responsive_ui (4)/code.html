<!-- Interaction Script -->
<script>
        function updateClock() {
            const now = new Date();
            
            // Format time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('digital-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('clock-seconds').textContent = `${seconds}s`;

            // Format date loosely for demo (static in HTML for reliable visual structure, but could be dynamic here)
        }

        setInterval(updateClock, 1000);
        updateClock(); // Initial call
        
        // Simple punch interaction feedback
        document.getElementById('btn-punch').addEventListener('click', function() {
            // Visual feedback handled by active: classes in Tailwind
            console.log('Punch recorded via UI simulation');
        });
    </script>
